<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>Neon Tic Tac Toe</title>
<meta name="description" content="Cosmic 3D glossy neon Tic-Tac-Toe game with AI opponent, local multiplayer, and interactive motion." />
<meta property="og:title" content="Neon Tic Tac Toe" />
<meta property="og:description" content="Cosmic 3D glossy neon Tic-Tac-Toe game with AI opponent, local multiplayer, and interactive motion." />
<meta property="og:type" content="website" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@600;700;800&family=Vazirmatn:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --bg1:#060a2b;--bg2:#180e58;--blue:#3ea8ff;--cyan:#22d3ee;--pink:#ff4fd8;--violet:#8b5cf6;--gold:#ffc83d;
  --glass:rgba(16,22,74,.52);--border:rgba(160,185,255,.26);--ease:cubic-bezier(.34,1.56,.64,1);--ease-out:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden;background:radial-gradient(ellipse at 50% 15%,#161c6b 0%,var(--bg1) 55%,#04061d 100%);color:#fff;font-family:'Nunito',system-ui,sans-serif;user-select:none}
body.bright{background:radial-gradient(ellipse at 50% 15%,#262792 0%,#0b124d 55%,#07092a 100%)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;outline:none}
button:focus-visible{box-shadow:0 0 0 3px var(--cyan),0 0 18px var(--pink)!important}
h1,h2,.logo-txt,.banner-txt{font-family:'Fredoka','Nunito',sans-serif}
[dir="rtl"] body,[dir="rtl"] h1,[dir="rtl"] h2,[dir="rtl"] .banner-txt,[dir="rtl"] .btn-start,[dir="rtl"] .brand-pill,[dir="rtl"] .g-wordmark,[dir="rtl"] .res-banner{font-family:'Vazirmatn','Nunito',system-ui,sans-serif}
[dir="rtl"] .hero-title .crown-hat{left:auto;right:-.18em;transform:rotate(18deg)}
[dir="rtl"] .hero-title:hover .crown-hat{transform:rotate(8deg) translateY(-4px) scale(1.08)}
[dir="rtl"] .g-wordmark svg{left:auto;right:-.32em;transform:rotate(18deg)}
[dir="rtl"] .spark-ticks{left:auto;right:-26px;transform:scaleX(-1)}
[dir="rtl"] .play-tri{transform:scaleX(-1)}
[dir="rtl"] .mode-card:hover .arrow-dot{transform:translateX(-3px) scale(1.08)}
[dir="rtl"] .mode-card{text-align:right}
.lang-btn{width:auto!important;padding:0 12px;border-radius:999px!important;font-size:13px;font-weight:800;white-space:nowrap}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.clouds{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.cloud{position:absolute;left:-10%;width:120%;bottom:-60px;height:260px;transition:transform .12s linear;will-change:transform}
.cloud span{position:absolute;border-radius:50%;filter:blur(2px)}
.c1 span{background:radial-gradient(circle at 45% 25%,rgba(116,138,255,.55),rgba(32,42,140,.85) 62%,rgba(16,18,75,0) 72%);box-shadow:inset 0 8px 20px rgba(175,205,255,.45)}
.c2 span{background:radial-gradient(circle at 50% 25%,rgba(160,96,255,.6),rgba(44,24,120,.88) 60%,rgba(20,12,70,0) 72%);box-shadow:inset 0 8px 24px rgba(215,155,255,.42)}
.c3 span{background:radial-gradient(circle at 55% 22%,rgba(255,105,225,.55),rgba(74,26,155,.9) 56%,rgba(25,12,80,0) 72%);box-shadow:inset 0 10px 26px rgba(255,175,245,.5)}
.screen{position:relative;z-index:5;min-height:100vh;min-height:100dvh;width:100%;max-width:1320px;margin:0 auto;padding:clamp(10px,2.2vw,20px) clamp(12px,3vw,28px);display:none;flex-direction:column;justify-content:space-between;gap:10px;overflow-x:clip}
.screen.active{display:flex}
.glass{background:linear-gradient(155deg,rgba(45,62,145,.42),rgba(14,18,66,.68));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--border);box-shadow:inset 0 1px 1px rgba(255,255,255,.28),0 14px 36px rgba(4,6,30,.55)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;z-index:8}
.hero-bar{padding:8px 14px;border-radius:999px;background:linear-gradient(90deg,rgba(25,35,95,.55),rgba(16,20,70,.42));border:1px solid rgba(130,165,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 30px rgba(0,0,0,.35)}
.brand-pill{display:flex;align-items:center;gap:10px;font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(16px,3.8vw,21px);letter-spacing:.3px;white-space:nowrap}
.xo-badge{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;background:rgba(12,18,65,.75);border:1px solid rgba(110,160,255,.35);box-shadow:0 0 16px rgba(62,168,255,.25)}
.icon-row{display:flex;align-items:center;gap:8px;flex-shrink:0}
.ibtn{width:clamp(36px,8vw,42px);height:clamp(36px,8vw,42px);border-radius:50%;display:grid;place-items:center;position:relative;background:radial-gradient(circle at 30% 25%,rgba(145,175,255,.45),rgba(32,45,125,.85));border:1px solid rgba(185,210,255,.45);box-shadow:inset 0 2px 3px rgba(255,255,255,.4),0 0 18px rgba(62,168,255,.35);transition:transform .35s var(--ease),box-shadow .25s}
.ibtn.purp{background:radial-gradient(circle at 30% 25%,rgba(220,120,255,.55),rgba(90,26,165,.9));border-color:rgba(240,165,255,.5);box-shadow:inset 0 2px 4px rgba(255,255,255,.45),0 0 20px rgba(190,65,255,.45)}
.ibtn:hover{transform:scale(1.08);box-shadow:inset 0 2px 4px rgba(255,255,255,.6),0 0 26px rgba(62,168,255,.75)}
.ibtn.purp:hover{box-shadow:inset 0 2px 4px rgba(255,255,255,.6),0 0 28px rgba(255,79,216,.75)}
.ibtn:active{transform:scale(.94)}
.ibtn svg{width:48%;height:48%;fill:#fff;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.hero-grid{display:grid;grid-template-columns:1.05fr 1fr;align-items:center;gap:clamp(18px,3.5vw,32px);margin:auto 0;padding:8px 0}
.hero-left{display:flex;flex-direction:column;align-items:flex-start;gap:clamp(10px,2vh,16px)}
.tag-pill{display:inline-flex;align-items:center;gap:8px;padding:7px 15px;border-radius:999px;font-size:13px;font-weight:700;color:#e4ebff;background:rgba(22,30,90,.65);border:1px solid rgba(145,175,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 6px 20px rgba(0,0,0,.3)}
.hero-title{position:relative;font-size:clamp(38px,6.4vw,84px);line-height:1.02;font-weight:700;letter-spacing:-.5px;filter:drop-shadow(0 8px 24px rgba(10,10,50,.85));cursor:default}
.hero-title .crown-hat{position:absolute;left:-.18em;top:-.34em;width:.56em;height:.46em;transform:rotate(-18deg);filter:drop-shadow(0 0 12px rgba(255,200,61,.75));transition:transform .4s var(--ease)}
.hero-title:hover .crown-hat{transform:rotate(-8deg) translateY(-4px) scale(1.08)}
.hero-title .ch{display:inline-block;transition:transform .42s var(--ease);will-change:transform}
.hero-title .ch.sp{width:.26em}
.hero-title .toe .ch{background:linear-gradient(125deg,#ff4fd8 10%,#a855f7 52%,#3ea8ff 95%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(255,79,216,.48))}
.hero-title:hover .ch{transform:translateY(-8px) scale(1.06);transition-delay:calc(var(--i) * 28ms)}
.tagline{font-size:clamp(21px,2.8vw,36px);font-weight:700;color:#dbe7ff;letter-spacing:.2px}
.win-u{position:relative;display:inline-block;background:linear-gradient(95deg,#60a5fa,#e879f9,#ff4fd8);-webkit-background-clip:text;background-clip:text;color:transparent;font-style:italic}
.win-u svg{position:absolute;left:-4%;bottom:-8px;width:108%;height:14px;overflow:visible}
.win-u path{fill:none;stroke:url(#ugrad);stroke-width:4.5;stroke-linecap:round;stroke-dasharray:140;stroke-dashoffset:140;animation:drawLine 1.1s .55s var(--ease-out) forwards}
@keyframes drawLine{to{stroke-dashoffset:0}}
.subtitle{max-width:390px;font-size:clamp(14px,1.8vw,16px);line-height:1.5;color:rgba(216,228,255,.78)}
.cta-wrap{position:relative;display:inline-flex;align-items:center;margin-top:4px}
.spark-ticks{position:absolute;left:-26px;top:12px;width:22px;height:38px;pointer-events:none}
.spark-ticks span{position:absolute;display:block;height:3.5px;border-radius:4px;background:var(--pink);box-shadow:0 0 10px var(--pink)}
.spark-ticks span:nth-child(1){width:16px;transform:rotate(28deg);top:2px;left:4px}
.spark-ticks span:nth-child(2){width:18px;transform:rotate(-10deg);top:18px;left:0}
.btn-start{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:12px;padding:clamp(12px,2vw,16px) clamp(24px,3.6vw,32px);border-radius:999px;font-family:'Fredoka',sans-serif;font-size:clamp(18px,2.6vw,23px);font-weight:700;letter-spacing:.3px;background:linear-gradient(95deg,#2563eb 0%,#7c3aed 48%,#ff4fd8 100%);background-size:180% 100%;border:1.5px solid rgba(255,255,255,.55);box-shadow:inset 0 3px 6px rgba(255,255,255,.55),inset 0 -4px 10px rgba(25,8,65,.45),0 0 32px rgba(180,75,255,.65),0 14px 28px rgba(8,8,40,.6);transition:transform .28s var(--ease),background-position .45s,box-shadow .28s;will-change:transform}
.btn-start::after{content:'';position:absolute;top:-40%;left:-60%;width:45%;height:180%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-24deg);transition:left .65s var(--ease-out)}
.btn-start:hover{background-position:100% 0;box-shadow:inset 0 3px 8px rgba(255,255,255,.7),0 0 44px rgba(255,79,216,.85),0 18px 34px rgba(8,8,40,.75)}
.btn-start:hover::after{left:130%}
.btn-start:active{transform:scale(.95)!important}
.play-tri{width:0;height:0;border-top:8px solid transparent;border-bottom:8px solid transparent;border-left:14px solid #fff;filter:drop-shadow(0 0 6px rgba(255,255,255,.7))}
.rpl{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:rpl .55s ease-out forwards;pointer-events:none}
@keyframes rpl{to{transform:scale(4);opacity:0}}
.hero-right{position:relative;display:grid;place-items:center;perspective:1100px;min-height:clamp(240px,42vw,360px)}
.orbit{position:absolute;width:clamp(260px,78vw,430px);height:clamp(112px,34vw,185px);border-radius:50%;border:4px solid transparent;background:linear-gradient(90deg,var(--cyan),var(--violet),var(--pink),var(--cyan)) border-box;-webkit-mask:linear-gradient(#fff 0 0) padding-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;transform:rotateX(68deg) rotateZ(-14deg);box-shadow:0 0 28px rgba(62,168,255,.55);filter:drop-shadow(0 0 14px rgba(255,79,216,.65));animation:orbitSpin 9s linear infinite;pointer-events:none}
.hero-right:hover .orbit{animation-duration:3.2s;filter:drop-shadow(0 0 22px rgba(34,211,238,.9))}
@keyframes orbitSpin{from{transform:rotateX(68deg) rotateZ(-14deg) rotate(0deg)}to{transform:rotateX(68deg) rotateZ(-14deg) rotate(360deg)}}
.board3d{position:relative;width:clamp(210px,56vw,300px);height:clamp(210px,56vw,300px);padding:clamp(10px,2.2vw,15px);border-radius:clamp(20px,4vw,28px);display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,1.8vw,11px);transform-style:preserve-3d;background:linear-gradient(135deg,#4f8bff 0%,#3a48d6 45%,#a944f0 78%,#ff58d6 100%);box-shadow:inset 0 3px 5px rgba(255,255,255,.65),inset 0 -4px 8px rgba(15,10,55,.65),0 12px 0 #261b7d,0 18px 40px rgba(4,6,36,.85),0 0 42px rgba(139,92,246,.55);transition:transform .35s var(--ease);will-change:transform}
.board3d::before{content:'';position:absolute;inset:4px;border-radius:inherit;background:linear-gradient(155deg,#1d267a,#0c1146);box-shadow:inset 0 3px 10px rgba(0,0,0,.7);transform:translateZ(-1px)}
.board3d.hero-pose{transform:rotateX(14deg) rotateY(-18deg) rotateZ(-6deg)}
.board3d.flat{width:min(360px,84vw,46dvh);height:min(360px,84vw,46dvh);min-width:236px;min-height:236px;padding:clamp(11px,2.5vw,16px);gap:clamp(8px,2vw,12px);box-shadow:inset 0 3px 6px rgba(255,255,255,.7),inset 0 -4px 8px rgba(20,10,60,.65),0 10px 0 #2a1d88,0 24px 48px rgba(3,5,32,.88),0 0 46px rgba(168,85,247,.52)}
.cell{position:relative;border-radius:clamp(11px,2.4vw,16px);display:grid;place-items:center;transform-style:preserve-3d;background:radial-gradient(circle at 50% 35%,#141f6e 0%,#0b1147 88%);border:1px solid rgba(135,170,255,.28);box-shadow:inset 0 6px 14px rgba(3,5,25,.88),inset 0 -2px 5px rgba(110,145,255,.2);transition:transform .28s var(--ease),box-shadow .25s,border-color .25s,opacity .3s}
.cell:not(.filled):hover{border-color:rgba(95,215,255,.7);box-shadow:inset 0 4px 12px rgba(62,168,255,.35),0 0 18px rgba(62,168,255,.42)}
.cell.dim{opacity:.42}
.cell.win{border-color:#fff;box-shadow:inset 0 0 18px rgba(255,255,255,.45),0 0 28px var(--cyan),0 0 46px var(--pink);animation:winPulse 1s var(--ease) infinite alternate}
@keyframes winPulse{from{transform:scale(1) translateZ(6px)}to{transform:scale(1.07) translateZ(16px)}}
.board3d.shake{animation:bShake .45s var(--ease)}
@keyframes bShake{0%,100%{transform:scale(1)}30%{transform:scale(1.03) rotate(-1.6deg)}60%{transform:scale(1.02) rotate(1.5deg)}}
/* Glossy 3D CSS Pieces */
.px,.po{position:relative;width:58%;height:58%;pointer-events:none;transform-style:preserve-3d;transition:transform .34s var(--ease)}
.px{filter:drop-shadow(0 6px 0 #0945a8) drop-shadow(0 0 14px rgba(34,211,238,.82))}
.px::before,.px::after{content:'';position:absolute;left:50%;top:50%;width:100%;height:30%;border-radius:999px;background:linear-gradient(180deg,#8ee9ff 0%,#38a5ff 45%,#0b62db 100%);box-shadow:inset 0 3px 3px rgba(255,255,255,.78),inset 0 -3px 4px rgba(4,34,110,.65)}
.px::before{transform:translate(-50%,-50%) rotate(45deg)}
.px::after{transform:translate(-50%,-50%) rotate(-45deg)}
.po{border-radius:50%;background:radial-gradient(circle at 35% 24%,#ffb4ef 0%,#ff4fd8 42%,#c5139c 100%);-webkit-mask:radial-gradient(circle,transparent 39%,#000 41%);mask:radial-gradient(circle,transparent 39%,#000 41%);filter:drop-shadow(0 6px 0 #7b0761) drop-shadow(0 0 14px rgba(255,79,216,.85))}
.po::after{content:'';position:absolute;inset:8% 18% 58% 18%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.7),transparent)}
.ghost{opacity:.42;transform:translateY(-5px) scale(.92);animation:ghostFloat 1.4s ease-in-out infinite alternate}
@keyframes ghostFloat{to{transform:translateY(-10px) scale(.98)}}
.pop{animation:popIn .44s var(--ease) both}
@keyframes popIn{0%{transform:scale(.15) translateZ(40px);opacity:0}70%{transform:scale(1.16) translateZ(14px);opacity:1}100%{transform:scale(1) translateZ(8px)}}
.shock{position:absolute;inset:12%;border-radius:50%;border:3px solid var(--cyan);animation:shock .5s ease-out forwards;pointer-events:none}
.shock.o{border-color:var(--pink)}
@keyframes shock{from{transform:scale(.4);opacity:.9}to{transform:scale(1.65);opacity:0}}
.mode-row{display:grid;grid-template-columns:repeat(2,minmax(240px,330px));justify-content:center;gap:20px;margin:8px auto 4px}
.mode-card{--mx:50%;--my:50%;position:relative;display:flex;align-items:center;gap:14px;padding:13px 18px;border-radius:20px;text-align:left;background:linear-gradient(155deg,rgba(36,48,125,.52),rgba(14,18,62,.75));backdrop-filter:blur(12px);border:1px solid rgba(155,180,255,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 12px 28px rgba(3,5,28,.55);transition:transform .28s var(--ease),box-shadow .28s;transform-style:preserve-3d;overflow:hidden}
.mode-card::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:radial-gradient(180px circle at var(--mx) var(--my),rgba(94,234,212,.85),rgba(255,79,216,.65) 45%,transparent 75%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .25s}
.mode-card:hover::before{opacity:1}
.mode-card:hover{box-shadow:0 18px 36px rgba(10,12,55,.75),0 0 26px rgba(139,92,246,.4)}
.mode-card:active{transform:scale(.97)!important}
.mode-ava{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:radial-gradient(circle at 40% 30%,rgba(110,165,255,.35),rgba(20,25,85,.7));flex-shrink:0}
.mode-ava svg{width:46px;height:46px}
.mode-meta b{display:block;font-size:17px;font-weight:800}
.mode-meta span{font-size:12.5px;color:rgba(215,228,255,.72)}
.arrow-dot{margin-left:auto;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#6366f1,#9333ea);box-shadow:0 0 14px rgba(139,92,246,.6);font-weight:800;transition:transform .25s var(--ease)}
.mode-card:hover .arrow-dot{transform:translateX(3px) scale(1.08)}
.scroll-hint{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;color:rgba(205,220,255,.62);cursor:pointer;margin-top:4px}
.mouse-ico{width:18px;height:26px;border:1.8px solid rgba(205,220,255,.55);border-radius:10px;position:relative}
.mouse-ico::after{content:'';position:absolute;left:50%;top:5px;width:3px;height:6px;border-radius:3px;background:#fff;transform:translateX(-50%);animation:scrollDot 1.6s infinite}
@keyframes scrollDot{0%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,8px)}}
/* Game Screen */
.g-logo{display:flex;align-items:center;gap:10px}
.g-wordmark{position:relative;font-family:'Fredoka',sans-serif;font-size:clamp(17px,3.8vw,28px);font-weight:700;text-shadow:0 3px 0 #10134d,0 0 18px rgba(139,92,246,.65);white-space:nowrap}
.g-wordmark span{background:linear-gradient(95deg,#ff4fd8,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent}
.g-wordmark svg{position:absolute;left:-.32em;top:-.46em;width:.95em;height:.75em;transform:rotate(-18deg)}
.turn-pill{min-width:clamp(180px,28vw,250px);padding:8px 18px 10px;border-radius:999px;text-align:center;font-weight:800;font-size:clamp(14px,2vw,17px);letter-spacing:.3px}
.timer-track{margin-top:6px;height:6px;width:100%;border-radius:99px;background:rgba(8,10,45,.75);overflow:hidden;border:1px solid rgba(165,190,255,.2)}
.timer-fill{height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,var(--pink),var(--violet),var(--cyan));box-shadow:0 0 10px var(--pink);transition:width .18s linear}
.arena{display:grid;grid-template-columns:minmax(195px,225px) 1fr minmax(92px,110px);align-items:center;gap:clamp(12px,2vw,20px);margin:auto 0;z-index:6}
.side-card{padding:14px;border-radius:24px;display:flex;flex-direction:column;gap:10px}
.side-head{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px}
.side-head svg{width:20px;height:20px;fill:#c7d8ff}
.mode-btn{display:flex;align-items:center;gap:10px;padding:10px 13px;border-radius:999px;font-size:14px;font-weight:800;background:rgba(12,18,68,.65);border:1px solid rgba(135,170,255,.26);transition:transform .25s var(--ease),box-shadow .25s}
.mode-btn.on{background:linear-gradient(95deg,#2563eb,#9333ea,#ff4fd8);border-color:rgba(255,255,255,.55);box-shadow:inset 0 2px 3px rgba(255,255,255,.4),0 0 22px rgba(255,79,216,.55)}
.mode-btn:hover{transform:scale(1.04)}
.mode-btn svg{width:24px;height:24px;flex-shrink:0}
.mode-btn .chev{margin-left:auto;opacity:.8}
.diff-row{display:flex;gap:6px;margin-top:2px}
.diff-chip{flex:1;padding:6px 4px;border-radius:999px;font-size:12px;font-weight:800;background:rgba(12,18,68,.65);border:1px solid rgba(135,170,255,.25);opacity:.72;transition:.2s}
.diff-chip.on{opacity:1;background:linear-gradient(95deg,var(--blue),var(--violet));border-color:#fff;box-shadow:0 0 12px rgba(62,168,255,.5)}
.center-col{display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2vh,18px);width:100%}
.hud-row{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:660px;gap:12px}
.pcard{position:relative;display:flex;align-items:center;gap:clamp(8px,1.5vw,12px);padding:6px;padding-inline:6px 14px;border-radius:999px;min-width:0;flex:0 1 235px;transition:transform .35s var(--ease),box-shadow .35s,border-color .35s}
.pcard.right{flex-direction:row-reverse;padding-inline:14px 6px;text-align:end}
.pcard.active.x{border-color:var(--cyan);box-shadow:inset 0 1px 1px rgba(255,255,255,.35),0 0 28px rgba(62,168,255,.72);transform:scale(1.04)}
.pcard.active.o{border-color:var(--pink);box-shadow:inset 0 1px 1px rgba(255,255,255,.35),0 0 28px rgba(255,79,216,.72);transform:scale(1.04)}
.pcard .ava-ring{width:clamp(42px,8vw,58px);height:clamp(42px,8vw,58px);flex-shrink:0;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 40% 30%,rgba(62,168,255,.35),rgba(10,14,55,.85));border:2px solid rgba(110,195,255,.65);box-shadow:0 0 18px rgba(62,168,255,.45)}
.pcard.right .ava-ring{background:radial-gradient(circle at 40% 30%,rgba(255,79,216,.35),rgba(20,10,55,.85));border-color:rgba(255,130,225,.65);box-shadow:0 0 18px rgba(255,79,216,.45)}
.pcard svg{width:78%;height:78%;transition:transform .4s var(--ease)}
.pcard.happy svg{animation:botHappy .65s var(--ease)}
.pcard.sad svg{transform:rotate(-14deg) translateY(3px);opacity:.78}
@keyframes botHappy{0%,100%{transform:translateY(0)}40%{transform:translateY(-10px) scale(1.12)}70%{transform:translateY(-3px)}}
.pmeta{display:flex;flex-direction:column;gap:3px;min-width:0}
.pname{font-size:clamp(12px,2.4vw,14px);font-weight:800;color:#eaf1ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pstats{display:flex;align-items:center;gap:8px}
.pcard.right .pstats{flex-direction:row-reverse}
.mini-sym{width:22px;height:22px;display:grid;place-items:center}
.mini-sym .px,.mini-sym .po{width:20px;height:20px}
.score-dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:radial-gradient(circle at 30% 25%,rgba(80,170,255,.55),rgba(14,28,98,.9));border:1px solid rgba(155,215,255,.45)}
.pcard.right .score-dot{background:radial-gradient(circle at 30% 25%,rgba(255,95,220,.55),rgba(80,14,98,.9));border-color:rgba(255,165,235,.45)}
.board-stage{position:relative;perspective:1100px}
.win-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4;overflow:visible}
.win-line{stroke-width:10;stroke-linecap:round;fill:none;filter:drop-shadow(0 0 12px var(--cyan)) drop-shadow(0 0 24px var(--pink));stroke-dasharray:460;stroke-dashoffset:460}
.win-line.draw{animation:drawWin .48s var(--ease-out) forwards}
@keyframes drawWin{to{stroke-dashoffset:0}}
.right-dock{padding:16px 12px;border-radius:42px;display:flex;flex-direction:column;align-items:center;gap:14px}
.dock-item{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:800;color:#dce8ff}
.dock-item .ibtn{width:clamp(44px,9vw,54px);height:clamp(44px,9vw,54px)}
.goal-pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 18px;border-radius:999px;font-size:clamp(12px,2.5vw,14px);font-weight:800;color:#eaf1ff;margin:2px auto 0;text-align:center}
.goal-pill svg{width:20px;height:20px;flex-shrink:0}
/* Decorative Floating 3D X / O */
.floater{position:fixed;pointer-events:none;z-index:3;transition:transform .22s ease-out;will-change:transform}
.floater .px,.floater .po{width:100%;height:100%}
/* Modals */
.modal{position:fixed;inset:0;z-index:30;display:none;place-items:center;padding:16px;background:rgba(5,7,28,.62);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.modal.open{display:grid;animation:fadeIn .28s ease-out}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-card{width:min(420px,94vw);padding:clamp(20px,4vw,28px) clamp(18px,4vw,26px);border-radius:28px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;animation:popModal .42s var(--ease)}
@keyframes popModal{from{transform:scale(.76);opacity:0}to{transform:scale(1);opacity:1}}
.res-banner{padding:9px 22px;border-radius:999px;font-family:'Fredoka',sans-serif;font-size:clamp(22px,5vw,28px);font-weight:700;background:linear-gradient(95deg,#5b21b6,#c026d3,#7c3aed);border:1.5px solid rgba(255,215,255,.55);box-shadow:0 0 28px rgba(217,70,239,.65);display:inline-flex;align-items:center;gap:10px}
.trophy-stage{position:relative;width:136px;height:126px;display:grid;place-items:center}
.trophy-ring{position:absolute;width:130px;height:60px;border-radius:50%;border:4px solid transparent;background:linear-gradient(90deg,var(--cyan),var(--pink),var(--cyan)) border-box;-webkit-mask:linear-gradient(#fff 0 0) padding-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;transform:rotateX(68deg);animation:orbitSpin 4s linear infinite;bottom:8px;filter:drop-shadow(0 0 12px var(--cyan))}
.trophy-stage svg{width:88px;height:88px;filter:drop-shadow(0 0 22px rgba(255,200,61,.7));animation:bob 2.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.modal-actions{display:flex;gap:10px;width:100%;margin-top:4px}
.mbtn{flex:1;padding:12px 14px;border-radius:999px;font-weight:800;font-size:clamp(14px,3.2vw,16px);display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid rgba(255,255,255,.48);box-shadow:inset 0 2px 4px rgba(255,255,255,.45),0 0 20px rgba(139,92,246,.55);transition:transform .25s var(--ease)}
.mbtn.pri{background:linear-gradient(95deg,#2563eb,#c026d3)}
.mbtn.sec{background:linear-gradient(95deg,#1d4ed8,#7c3aed)}
.mbtn:hover{transform:scale(1.06)}.mbtn:active{transform:scale(.95)}
.stagger{opacity:0;transform:translateY(18px) scale(.96);animation:staggerIn .65s var(--ease) forwards;animation-delay:calc(var(--d,0) * 95ms)}
@keyframes staggerIn{to{opacity:1;transform:none}}
@media(max-width:920px){
  .hero-grid{grid-template-columns:1fr;text-align:center}.hero-left{align-items:center}.subtitle{max-width:460px}
  .arena{grid-template-columns:1fr;justify-items:center;gap:12px}.center-col{order:1;width:100%}
  .side-card{width:min(420px,100%);order:2;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .side-head,.diff-row{grid-column:1/-1}.right-dock{flex-direction:row;border-radius:999px;padding:8px 22px;order:3;gap:22px}
  .dock-item{flex-direction:row;gap:8px}
}
@media(max-width:640px){
  #game .topbar{flex-wrap:wrap}#game .turn-pill{order:3;flex:1 1 100%;max-width:280px;margin:0 auto;min-width:0}
  .mode-row{grid-template-columns:1fr;width:min(380px,100%)}.hud-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pcard,.pcard.right{flex:none;width:100%}.floater{opacity:.42!important;transform:scale(.68)}
  body>.floater{display:none}.scroll-hint{display:none}
}
@media(max-height:740px)and(min-width:921px){.hero-right{min-height:290px}.board3d{width:255px;height:255px}.orbit{width:370px;height:158px}}
@media(hover:none){.cell:not(.filled):hover{border-color:rgba(135,170,255,.28);box-shadow:inset 0 6px 14px rgba(3,5,25,.88),inset 0 -2px 5px rgba(110,145,255,.2)}}
@media(prefers-reduced-motion:reduce){*,::before,::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

<script>
const $=(s,p=document)=>p.querySelector(s),$$=(s,p=document)=>[...p.querySelectorAll(s)],lerp=(a,b,t)=>a+(b-a)*t,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const T={
  en:{brand:'Tic Tac Toe',badge:'The Classic Game',logoA:'Tic Tac ',logoB:'Toe',tagLead:'Think. Plan. ',tagWin:'Win!',sub:'A timeless classic, reimagined with a modern touch.',start:'Start Game',vsAiTitle:'Play vs AI',vsAiSub:'Challenge the Computer!',vsFrTitle:'Play vs Friend',vsFrSub:'Have Fun Together!',scroll:'Scroll to explore',gameMode:'Game Mode',vsComp:'vs Computer',vsFriend:'vs Friend',easy:'Easy',med:'Medium',hard:'Hard',restart:'Restart',home:'Home',goal:'— First to get 3 in a row wins! —',playAgain:'▶ Play Again',homeBtn:'⌂ Home',gotIt:'Got it!',you:'You',comp:'Computer',p1:'Player 1',p2:'Player 2',turnYou:'Your Turn',turnComp:"Computer's Turn",turnP1:"Player 1's Turn",turnP2:"Player 2's Turn",win:'Winner!',draw:"It's a Draw!",winAi:'You outsmarted the Computer!',loseAi:'Computer wins this round!',winP1:'Player 1 takes the crown!',winP2:'Player 2 takes the crown!',drawSub:'Great minds think alike — try another round!',infoTitle:'How to Play',setTitle:'Game Settings',infoBody:'Get <b>3 glossy X or O pieces</b> in a row before the <b>15s turn timer</b> runs out! Switch between <b>vs AI</b> (Easy, Medium, unbeatable Hard) or <b>vs Friend</b> anytime.',setBody:'Choose your AI difficulty in the <b>Game Mode</b> panel, or switch language below:',langBtn:'فارسی',chev:'›',arr:'→'},

};
const tr=k=>T[S.lang][k]||k,num=n=>S.lang==='fa'?n.toLocaleString('fa-IR'):n;
const renderLogo=()=>{
  const d=T[S.lang],tic=$('.tic'),toe=$('.toe');tic.innerHTML='';toe.innerHTML='';

const applyLang=()=>{

};
// WebAudio Synth
let ac=null;
const sfx=type=>{
  if(!S.sound)return;
  if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();
  if(ac.state==='suspended')ac.resume();
  const now=ac.currentTime,tone=(f,d,w='sine',v=.11,delay=0)=>{
    const o=ac.createOscillator(),g=ac.createGain();o.type=w;o.frequency.setValueAtTime(f,now+delay);
    g.gain.setValueAtTime(.001,now+delay);g.gain.exponentialRampToValueAtTime(v,now+delay+.015);
    g.gain.exponentialRampToValueAtTime(.0001,now+delay+d);o.connect(g);g.connect(ac.destination);
    o.start(now+delay);o.stop(now+delay+d+.02);
  };
  if(type==='hover')tone(640,.05,'triangle',.03);
  else if(type==='X'){tone(560,.14,'sine',.13);tone(840,.12,'triangle',.08,.05)}
  else if(type==='O'){tone(340,.16,'sine',.13);tone(260,.15,'triangle',.08,.05)}
  else if(type==='win')[523,659,784,1046].forEach((f,i)=>tone(f,.22,'triangle',.13,i*.08));
  else if(type==='draw')[392,349,311].forEach((f,i)=>tone(f,.18,'sine',.09,i*.09));
  else if(type==='click')tone(720,.08,'sine',.08);
};
// Build Hero Logo & Boards
(()=>{
  renderLogo();
  const hb=$('#hero-board'),demo=['X','O','X','O','X','','X','O','O'],zs=[12,18,10,16,24,0,14,18,20];
  demo.forEach((v,i)=>{const c=document.createElement('div');c.className='cell';if(v){const p=document.createElement('div');p.className=v==='X'?'px':'po';p.dataset.z=zs[i];p.style.transform=`translateZ(${zs[i]}px)`;c.appendChild(p)}hb.appendChild(c)});
  const gb=$('#game-board');
  for(let i=0;i<9;i++){const b=document.createElement('button');b.className='cell';b.dataset.idx=i;b.setAttribute('aria-label',`Row ${Math.floor(i/3)+1} Column ${i%3+1}`);gb.appendChild(b)}
})();
// Canvas Starfield, Shooting Stars, Cursor Light & Sparkle/Confetti Particles
const cv=$('#fx'),ctx=cv.getContext('2d'),stars=[],parts=[];
let W=0,H=0,dpr=1,mx=innerWidth/2,my=innerHeight/2,smx=mx,smy=my,raf=null,lastTrail=0;
const resize=()=>{dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)};
resize();addEventListener('resize',resize);
for(let i=0;i<95;i++)stars.push({x:Math.random(),y:Math.random(),r:Math.random()*1.8+.5,a:Math.random()*6.28,sp:.015+Math.random()*.03,cross:i%7===0,col:i%3===0?'#67e8f9':i%3===1?'#f472b6':'#e0e7ff'});
let shoot=null;
const burst=(x,y,kind,n=16)=>{
  if(reduced)return;
  for(let i=0;i<n;i++){
    const ang=Math.random()*6.28,sp=kind==='conf'?2+Math.random()*5:1.5+Math.random()*4;
    parts.push({x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp-(kind==='conf'?3:0),life:1,dec:kind==='conf'?.009:.032,sz:kind==='conf'?6+Math.random()*5:2.5+Math.random()*3,sym:kind==='conf'?(i%2?'X':'O'):'.',col:kind==='X'?'#38bdf8':kind==='O'?'#ff4fd8':i%2?'#38bdf8':'#ff4fd8',g:kind==='conf'?.08:.02,rot:Math.random()*6});
  }
};
const tick=t=>{
  ctx.clearRect(0,0,W,H);
  smx=lerp(smx,mx,.14);smy=lerp(smy,my,.14);
  if(!reduced){
    const rg=ctx.createRadialGradient(smx,smy,0,smx,smy,220);
    rg.addColorStop(0,'rgba(56,189,248,.14)');rg.addColorStop(.45,'rgba(255,79,216,.08)');rg.addColorStop(1,'transparent');
    ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
  }
  const ox=(smx/W-.5)*22,oy=(smy/H-.5)*14;
  for(const s of stars){
    s.a+=s.sp;const al=.35+.65*Math.abs(Math.sin(s.a)),sx=s.x*W-ox*(s.r*.7),sy=s.y*H-oy*(s.r*.7);
    ctx.globalAlpha=al;ctx.fillStyle=s.col;
    if(s.cross){ctx.fillRect(sx-s.r*3,sy-.7,s.r*6,1.4);ctx.fillRect(sx-.7,sy-s.r*3,1.4,s.r*6)}
    ctx.beginPath();ctx.arc(sx,sy,s.r,0,6.28);ctx.fill();
  }
  if(!shoot&&!reduced&&Math.random()<.005)shoot={x:Math.random()*W*.7,y:Math.random()*H*.35,vx:9+Math.random()*5,vy:4+Math.random()*3,life:1};
  if(shoot){
    ctx.globalAlpha=shoot.life;const g=ctx.createLinearGradient(shoot.x,shoot.y,shoot.x-60,shoot.y-25);
    g.addColorStop(0,'#fff');g.addColorStop(1,'transparent');ctx.strokeStyle=g;ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(shoot.x,shoot.y);ctx.lineTo(shoot.x-60,shoot.y-25);ctx.stroke();
    shoot.x+=shoot.vx;shoot.y+=shoot.vy;shoot.life-=.028;if(shoot.life<=0)shoot=null;
  }
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.life-=p.dec;p.rot+=.06;
    if(p.life<=0){parts.splice(i,1);continue}
    ctx.save();ctx.globalAlpha=p.life;ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.strokeStyle=p.col;ctx.fillStyle=p.col;ctx.lineWidth=2.4;
    if(p.sym==='X'){ctx.beginPath();ctx.moveTo(-p.sz,-p.sz);ctx.lineTo(p.sz,p.sz);ctx.moveTo(p.sz,-p.sz);ctx.lineTo(-p.sz,p.sz);ctx.stroke()}
    else if(p.sym==='O'){ctx.beginPath();ctx.arc(0,0,p.sz,0,6.28);ctx.stroke()}
    else{ctx.beginPath();ctx.arc(0,0,p.sz,0,6.28);ctx.fill()}
    ctx.restore();
  }
  ctx.globalAlpha=1;
  // Hero Interactive Motion (Parallax, Board Tilt, Piece Lift, Floaters, Magnetic CTA, Robot Eyes)
  if(!reduced&&S.screen==='hero'&&ptrActive){
    const nx=smx/W-.5,ny=smy/H-.5;
    $$('.cloud').forEach(c=>{const d=+c.dataset.depth;c.style.transform=`translate3d(${-nx*d}px,${-ny*d*.6}px,0)`});
    const hb=$('#hero-board'),r=hb.getBoundingClientRect();
    const bx=clamp((smx-(r.left+r.width/2))/(W*.45),-1,1),by=clamp((smy-(r.top+r.height/2))/(H*.45),-1,1);
    hb.style.transform=`rotateX(${14-by*14}deg) rotateY(${-18+bx*15}deg) rotateZ(-6deg)`;
    $$('.px,.po',hb).forEach(p=>{
      const pr=p.getBoundingClientRect(),d=Math.hypot(mx-(pr.left+pr.width/2),my-(pr.top+pr.height/2)),lift=d<90?(1-d/90)*26:0,sc=1+lift/95;
      p.style.transform=`translateZ(${+p.dataset.z+lift}px) scale(${sc})`;
    });
    const st=$('#btn-start'),sr=st.getBoundingClientRect(),dx=mx-(sr.left+sr.width/2),dy=my-(sr.top+sr.height/2),dist=Math.hypot(dx,dy);
    st.style.transform=dist<140?`translate(${dx*.16}px,${dy*.18}px) scale(1.04)`:'';
  }
  if(!reduced){
    $$('[data-fx]').forEach((f,i)=>{
      const fr=f.getBoundingClientRect(),cx=fr.left+fr.width/2,cy=fr.top+fr.height/2,dx=cx-mx,dy=cy-my,d=Math.hypot(dx,dy);
      const rep=ptrActive&&d<150?(1-d/150)*22:0,ang=Math.atan2(dy,dx),bob=Math.sin(t*.0015+i*1.7)*8;
      f.style.transform=`translate(${Math.cos(ang)*rep}px,${Math.sin(ang)*rep+bob}px) rotate(${(i%2?1:-1)*(14+Math.sin(t*.001+i)*6)}deg)`;
    });
    const ex=clamp((mx/W-.5)*3,-2,2),ey=clamp((my/H-.5)*2,-1.5,1.5);
    $$('.bot-eyes').forEach(g=>g.setAttribute('transform',`translate(${ex},${ey})`));
  }
  raf=requestAnimationFrame(tick);
};
let ptrActive=matchMedia('(hover:hover)').matches;
raf=requestAnimationFrame(tick);
document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf);stopTimer()}else{raf=requestAnimationFrame(tick);if(S.screen==='game'&&!S.locked)startTimer()}});
addEventListener('pointermove',e=>{
  if(e.pointerType==='touch'){ptrActive=false;return}
  ptrActive=true;mx=e.clientX;my=e.clientY;
  if(!reduced&&performance.now()-lastTrail>45&&parts.filter(p=>p.sym==='.').length<20){
    lastTrail=performance.now();
    parts.push({x:mx,y:my,vx:(Math.random()-.5)*.8,vy:(Math.random()-.5)*.8,life:1,dec:.04,sz:2.2,sym:'.',col:Math.random()>.5?'#38bdf8':'#ff4fd8',g:0,rot:0});
  }
});
// Mode Card 3D Tilt & Cursor Glow Border
$$('.mode-card').forEach(c=>{
  c.addEventListener('pointermove',e=>{
    if(reduced||e.pointerType==='touch')return;const r=c.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
    c.style.setProperty('--mx',x+'px');c.style.setProperty('--my',y+'px');
    c.style.transform=`perspective(700px) rotateX(${(y/r.height-.5)*-10}deg) rotateY(${(x/r.width-.5)*12}deg) scale(1.03)`;
  });
  c.addEventListener('pointerleave',()=>c.style.transform='');
});
// Game Logic & Minimax AI
const checkWin=b=>{for(const w of WINS)if(b[w[0]]&&b[w[0]]===b[w[1]]&&b[w[0]]===b[w[2]])return{p:b[w[0]],line:w};return b.every(Boolean)?{p:'D'}:null};
const minimax=(b,isMax,d)=>{
  const r=checkWin(b);if(r)return r.p==='O'?10-d:r.p==='X'?d-10:0;
  let best=isMax?-99:99;
  for(let i=0;i<9;i++)if(!b[i]){b[i]=isMax?'O':'X';best=isMax?Math.max(best,minimax(b,false,d+1)):Math.min(best,minimax(b,true,d+1));b[i]=''}
  return best;
};
const pickAI=()=>{
  const emp=S.board.map((v,i)=>v?-1:i).filter(i=>i>=0);
  if(S.diff==='easy'||(S.diff==='med'&&Math.random()<.5))return emp[Math.floor(Math.random()*emp.length)];
  let best=-99,mv=emp[0];
  for(const i of emp){S.board[i]='O';const sc=minimax(S.board,false,0);S.board[i]='';if(sc>best){best=sc;mv=i}}
  return mv;
};
const stopTimer=()=>{clearInterval(S.tId);S.tId=null};
const startTimer=()=>{
  stopTimer();S.tLeft=15;$('#timer-fill').style.width='100%';
  S.tId=setInterval(()=>{
    if(S.locked||S.screen!=='game')return;
    S.tLeft-=.2;$('#timer-fill').style.width=clamp(S.tLeft/15*100,0,100)+'%';
    if(S.tLeft<=0){stopTimer();const emp=S.board.map((v,i)=>v?-1:i).filter(i=>i>=0);if(emp.length)place(emp[Math.floor(Math.random()*emp.length)])}
  },200);
};
const updateHUD=()=>{
  const isAI=S.mode==='ai';
  $('#name-x').textContent=isAI?tr('you'):tr('p1');$('#name-o').textContent=isAI?tr('comp'):tr('p2');
  $('#ava-o-svg use').setAttribute('href',isAI?'#s-bot-o':'#s-friends');
  $('#sc-x').textContent=num(S.scores.X);$('#sc-o').textContent=num(S.scores.O);
  $('#pcard-x').classList.toggle('active',S.turn==='X');$('#pcard-o').classList.toggle('active',S.turn==='O');
  $('#turn-lbl').textContent=S.turn==='X'?(isAI?tr('turnYou'):tr('turnP1')):(isAI?tr('turnComp'):tr('turnP2'));
  $('#m-ai').classList.toggle('on',isAI);$('#m-pvp').classList.toggle('on',!isAI);
  $('#diff-row').style.display=isAI?'flex':'none';
};
const resetBoard=()=>{
  stopTimer();S.board.fill('');S.locked=false;S.turn=S.starter;
  $$('.cell',$('#game-board')).forEach(c=>{c.className='cell';c.innerHTML=''});
  const wl=$('#win-line');wl.classList.remove('draw');wl.setAttribute('x1',0);wl.setAttribute('x2',0);
  $('#game-board').classList.remove('shake');$('#pcard-x').classList.remove('happy','sad');$('#pcard-o').classList.remove('happy','sad');
  $('#modal-res').classList.remove('open');updateHUD();
  if(S.mode==='ai'&&S.turn==='O'){S.locked=true;setTimeout(()=>{S.locked=false;place(pickAI())},500)}else startTimer();
};
const place=idx=>{
  if(S.locked||S.board[idx])return;
  S.board[idx]=S.turn;const cell=$$('.cell',$('#game-board'))[idx];
  cell.classList.add('filled');cell.innerHTML=`<div class="${S.turn==='X'?'px':'po'} pop"></div><div class="shock ${S.turn==='O'?'o':''}"></div>`;
  const r=cell.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,S.turn,16);sfx(S.turn);
  const res=checkWin(S.board);
  if(res){
    S.locked=true;stopTimer();
    if(res.p==='D'){
      sfx('draw');setTimeout(()=>showResult('D'),450);
    }else{
      S.scores[res.p]++;updateHUD();sfx('win');
      const cells=$$('.cell',$('#game-board'));
      cells.forEach((c,i)=>c.classList.add(res.line.includes(i)?'win':'dim'));
      $('#game-board').classList.add('shake');
      const p0=res.line[0],p2=res.line[2],pos=i=>({x:67+(i%3)*113,y:67+Math.floor(i/3)*113}),a=pos(p0),b=pos(p2);
      const wl=$('#win-line');wl.setAttribute('x1',a.x);wl.setAttribute('y1',a.y);wl.setAttribute('x2',b.x);wl.setAttribute('y2',b.y);wl.classList.add('draw');
      $(`#pcard-${res.p.toLowerCase()}`).classList.add('happy');$(`#pcard-${res.p==='X'?'o':'x'}`).classList.add('sad');
      setTimeout(()=>showResult(res.p),720);
    }
    S.starter=S.starter==='X'?'O':'X';return;
  }
  S.turn=S.turn==='X'?'O':'X';updateHUD();
  if(S.mode==='ai'&&S.turn==='O'){stopTimer();S.locked=true;setTimeout(()=>{S.locked=false;place(pickAI())},500)}else startTimer();
};
const showResult=p=>{
  const isAI=S.mode==='ai';
  $('#res-title').textContent=p==='D'?tr('draw'):tr('win');
  $('#res-sub').textContent=p==='D'?tr('drawSub'):p==='X'?(isAI?tr('winAi'):tr('winP1')):(isAI?tr('loseAi'):tr('winP2'));
  $('#modal-res').classList.add('open');
  if(p!=='D')for(let i=0;i<3;i++)setTimeout(()=>burst(W*(.3+.2*i),H*.38,'conf',22),i*160);
};
const openPop=kind=>{
  const m=$('#modal-pop');m.dataset.kind=kind;
  $('#pop-title').textContent=kind==='info'?tr('infoTitle'):tr('setTitle');
  const langPicker=`<div class="diff-row" style="margin-top:12px"><button class="diff-chip ${S.lang==='en'?'on':''}" data-act="setlang" data-l="en">English</button><button class="diff-chip ${S.lang==='fa'?'on':''}" data-act="setlang" data-l="fa">فارسی</button></div>`;
  $('#pop-body').innerHTML=(kind==='info'?tr('infoBody'):tr('setBody'))+langPicker;
  m.classList.add('open');
};
// Screen Navigation & Hero -> Game FLIP Board Transition
const goGame=(mode,btn)=>{
  if(btn){const sp=document.createElement('span');sp.className='rpl';const r=btn.getBoundingClientRect();sp.style.width=sp.style.height=Math.max(r.width,r.height)+'px';sp.style.left='0';sp.style.top='0';btn.appendChild(sp);setTimeout(()=>sp.remove(),560)}
  const hbRect=$('#hero-board').getBoundingClientRect();
  S.mode=mode||S.mode;S.scores={X:0,O:0};S.starter='X';S.screen='game';
  $('#hero').classList.remove('active');$('#game').classList.add('active');resetBoard();
  if(!reduced&&hbRect.width){
    const gb=$('#game-board'),gr=gb.getBoundingClientRect(),dx=hbRect.left-gr.left+(hbRect.width-gr.width)/2,dy=hbRect.top-gr.top+(hbRect.height-gr.height)/2,sc=hbRect.width/gr.width;
    tween(540,t=>{const k=1-t;gb.style.transform=`translate(${dx*k}px,${dy*k}px) scale(${lerp(sc,1,t)}) rotateX(${14*k}deg) rotateY(${-18*k}deg) rotateZ(${-6*k}deg)`},()=>gb.style.transform='');
  }
};
// Event Delegation
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act;sfx('click');
  if(act==='play')goGame(el.dataset.mode,el.id==='btn-start'?el:null);
  else if(act==='home'){stopTimer();S.screen='hero';$('#modal-res').classList.remove('open');$('#game').classList.remove('active');$('#hero').classList.add('active')}
  else if(act==='restart')resetBoard();
  else if(act==='setmode'){S.mode=el.dataset.mode;S.scores={X:0,O:0};S.starter='X';resetBoard()}
  else if(act==='diff'){S.diff=el.dataset.d;$$('.diff-chip').forEach(c=>c.classList.toggle('on',c.dataset.d===S.diff));resetBoard()}
  else if(act==='lang'){S.lang=S.lang==='en'?'fa':'en';applyLang()}
  else if(act==='setlang'){S.lang=el.dataset.l;applyLang()}
  else if(act==='sound'){S.sound=!S.sound;$$('[data-act="sound"] use').forEach(u=>u.setAttribute('href',S.sound?'#s-sound':'#s-mute'))}
  else if(act==='theme')document.body.classList.toggle('bright');
  else if(act==='info'||act==='settings')openPop(act);
  else if(act==='closepop')$('#modal-pop').classList.remove('open');
});
$('#game-board').addEventListener('click',e=>{const c=e.target.closest('.cell');if(c)place(+c.dataset.idx)});
$('#game-board').addEventListener('pointerover',e=>{
  const c=e.target.closest('.cell');if(!c||S.locked||S.board[+c.dataset.idx]||(S.mode==='ai'&&S.turn==='O'))return;
  sfx('hover');c.innerHTML=`<div class="${S.turn==='X'?'px':'po'} ghost"></div>`;
});
$('#game-board').addEventListener('pointerout',e=>{const c=e.target.closest('.cell');if(c&&!S.board[+c.dataset.idx])c.innerHTML=''});
</script>
</body>
</html>
